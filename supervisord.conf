[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# 1. IBKR Gateway
# Auto-detects the version from the installed files to prevent the "empty version" crash
[program:ibkr]
command=/bin/bash -c "export TWS_MAJOR_VRSN=$(ls /home/ibgateway/Jts/ibgateway | grep -E '^[0-9]+' | head -n 1) && export IB_GATEWAY_VERSION=$TWS_MAJOR_VRSN && /home/ibgateway/scripts/run.sh"
user=ibgateway
environment=HOME="/home/ibgateway",USER="ibgateway"
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# 2. Python Bot
# Checks both 4001 (Live) and 4002 (Paper) before starting
[program:ibkr_bot]
command=bash -c "echo 'Waiting for IBKR...' && while ! nc -z localhost 4001 && ! nc -z localhost 4002; do sleep 1; done && echo 'IBKR Connected! Starting Bot...' && sleep 10 && make %(ENV_MAKE_COMMAND)s"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20