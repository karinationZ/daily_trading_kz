[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# 1. IBKR Gateway
[program:ibkr]
# FIX: Inject -XX:+UseSerialGC and limit RAM to prevent CPU thrashing
command=/bin/bash -c "echo '-XX:+UseSerialGC' >> /home/ibgateway/Jts/ibgateway.vmoptions && echo '-Xmx768m' >> /home/ibgateway/Jts/ibgateway.vmoptions && export TWS_MAJOR_VRSN=$(ls /home/ibgateway/Jts/ibgateway | grep -E '^[0-9]+' | head -n 1) && export IB_GATEWAY_VERSION=$TWS_MAJOR_VRSN && exec /home/ibgateway/scripts/run.sh"
user=ibgateway
environment=HOME="/home/ibgateway",USER="ibgateway"
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# 2. Python Bot
[program:ibkr_bot]
# ADDED 'exec' before 'make': prevents the bot from getting stuck in a shell process
command=bash -c "echo 'Waiting for IBKR...' && while ! nc -z localhost 4001 && ! nc -z localhost 4002; do sleep 1; done && echo 'IBKR Connected! Starting Bot...' && sleep 10 && exec make %(ENV_MAKE_COMMAND)s"
directory=/app
autostart=true
autorestart=true
# ADDED signal handling for the bot too, just to be safe
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20